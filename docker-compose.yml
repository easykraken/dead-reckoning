services:
  nginx:
    image: nginx:alpine
    ports:
      - "8888:80"
    volumes:
      - ./data:/usr/share/nginx/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - mock-api

  mock-api:
    build: ./docker/mock-api
    ports:
      - "3000:3000"
