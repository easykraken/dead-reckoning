server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index frontend.html;

    # Main board page
    location = / {
        try_files /frontend.html =404;
    }

    # Admin panel
    location = /admin {
        try_files /admin.html =404;
    }

    # Static assets (CSS, JS)
    location ~* \.(css|js)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    # API mock endpoints — proxy to the mock API container
    location /api/ {
        proxy_pass http://mock-api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location = /messages {
        proxy_pass http://mock-api:3000/messages;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location = /post {
        proxy_pass http://mock-api:3000/post;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location = /info {
        proxy_pass http://mock-api:3000/info;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /admin/ {
        proxy_pass http://mock-api:3000/admin/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
